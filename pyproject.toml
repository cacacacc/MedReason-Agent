[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medreason-agent"
version = "0.1.0"
description = "Supervisor-guided multi-agent framework for reliable multimodal medical reasoning."
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "MedReason-Agent contributors" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pillow>=10.0",
  "pydantic>=2.7",
  "pyyaml>=6.0.1",
  "scikit-learn>=1.4",
  "tqdm>=4.66"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5"
]
agent = [
  "langgraph>=0.2",
  "langchain-core>=0.2"
]
rag = [
  "sentence-transformers>=3.0",
  "qdrant-client>=1.9"
]
vlm = [
  "accelerate>=0.30",
  "qwen-vl-utils>=0.0.8",
  "transformers>=4.45"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
