experiment_id: exp01_direct_vlm_qwen_smoke
name: Direct VLM Baseline - Qwen Smoke
phase: 1
inherits: configs/base.yaml

method:
  type: direct_vlm
  backend: qwen2_5_vl
  model_id: Qwen/Qwen2.5-VL-3B-Instruct
  torch_dtype: float32
  device_map: cpu
  prompt_version: direct_v1
  training_epochs: 0

dataset:
  name: VQA-RAD
  split: test
  scale: smoke
  max_samples: 1

generation:
  temperature: 0.0
  top_p: 1.0
  max_new_tokens: 64

outputs:
  result_dir: Results/exp01_direct_vlm_qwen_smoke
  prediction_file: predictions.jsonl
  metrics_file: metrics.json
