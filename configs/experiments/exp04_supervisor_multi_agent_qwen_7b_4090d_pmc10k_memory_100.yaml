experiment_id: exp04_supervisor_multi_agent_qwen_7b_4090d_pmc10k_memory_100
name: Supervisor Multi-Agent Persistent Memory - Qwen 2.5 VL 7B 4090D PMC 10k 100 Samples
phase: 4
inherits: configs/base.yaml

method:
  type: multi_agent
  backend: qwen2_5_vl
  model_id: /root/autodl-tmp/models/Qwen2.5-VL-7B-Instruct
  torch_dtype: bfloat16
  device_map: auto
  prompt_version: supervisor_multi_agent_memory_v1
  prompt_contract: structured_supervisor_agents_shared_persistent_memory_v1
  dynamic_routing: false
  deterministic_answer_gate: false
  question_routing: none
  agent_mode: supervisor_multi_agent
  rag_mode: supervised_retrieval_verification_memory
  training_epochs: 0

dataset:
  name: VQA-RAD
  split: test
  scale: tuning
  max_samples: 100

retrieval:
  enabled: true
  retriever: faiss
  embedding_model: /root/autodl-tmp/models/bge-small-en-v1.5
  index_path: Data/Processed/medical_kb/pmc_10k_bge_small.faiss
  metadata_path: Data/Processed/medical_kb/pmc_10k_bge_small_metadata.jsonl
  reranker: keyword_reranker
  corpus_name: pmc_abstracts_10k
  corpus_path: Data/Processed/medical_kb/pmc_10k_chunks.jsonl
  candidate_top_k: 10
  top_k: 5
  min_rerank_score: 0.0
  max_chars_per_evidence: 500

memory:
  enabled: true
  path: Experiments/memory/phase4_supervisor_qwen_4090d_memory_100.jsonl
  namespace: phase4_supervisor_qwen_4090d_memory_100
  top_k: 3
  min_score: 0.05
  read_enabled: true
  write_enabled: true
  include_prediction: false

generation:
  temperature: 0.0
  top_p: 1.0
  max_new_tokens: 256

outputs:
  result_dir: Results/exp04_supervisor_multi_agent_qwen_7b_4090d_pmc10k_memory_100
  prediction_file: predictions.jsonl
  metrics_file: metrics.json
