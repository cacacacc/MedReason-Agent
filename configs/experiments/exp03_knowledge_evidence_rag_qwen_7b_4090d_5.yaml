experiment_id: exp03_knowledge_evidence_rag_qwen_7b_4090d_5
name: Medical Knowledge + Evidence RAG Verifier - Qwen 2.5 VL 7B 4090D 5 Samples
phase: 3
inherits: configs/base.yaml

method:
  type: rag_vlm
  backend: qwen2_5_vl
  # AutoDL 上传模型后，建议改成本地路径：
  # /root/autodl-tmp/models/Qwen2.5-VL-7B-Instruct
  model_id: /root/autodl-tmp/models/Qwen2.5-VL-7B-Instruct
  torch_dtype: bfloat16
  device_map: auto
  prompt_version: knowledge_evidence_rag_v1
  prompt_contract: structured_knowledge_then_evidence_verification_v1
  rag_mode: knowledge_then_claim_verification
  training_epochs: 0

dataset:
  name: VQA-RAD
  split: test
  scale: smoke
  max_samples: 5

retrieval:
  retriever: keyword
  reranker: keyword_reranker
  corpus_path: Data/Processed/medical_kb/seed_chunks.jsonl
  candidate_top_k: 6
  # 组合路径会先做 Knowledge RAG，再做 Evidence RAG；4090D 上先保持 top_k=2。
  top_k: 2
  min_rerank_score: 0.0
  max_chars_per_evidence: 450

generation:
  temperature: 0.0
  top_p: 1.0
  # Phase 3 结构化 verifier 输出统一使用 256。
  max_new_tokens: 256

outputs:
  result_dir: Results/exp03_knowledge_evidence_rag_qwen_7b_4090d_5
  prediction_file: predictions.jsonl
  metrics_file: metrics.json
