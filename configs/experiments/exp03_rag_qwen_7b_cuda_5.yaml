experiment_id: exp03_rag_qwen_7b_cuda_5
name: Medical RAG Baseline - Qwen 2.5 VL 7B CUDA 5 Samples
phase: 3
inherits: configs/base.yaml

method:
  type: rag_vlm
  backend: qwen2_5_vl
  model_id: Qwen/Qwen2.5-VL-7B-Instruct
  # 4070 显存通常是 12GB，bfloat16/float16 都是半精度；Ada 架构可用 bfloat16。
  torch_dtype: bfloat16
  device_map: auto
  prompt_version: rag_v2
  training_epochs: 0

dataset:
  name: VQA-RAD
  split: test
  scale: smoke
  max_samples: 5

retrieval:
  retriever: keyword
  reranker: keyword_reranker
  corpus_path: Data/Processed/medical_kb/seed_chunks.jsonl
  # 先多召回少量候选，再由 reranker/filter 决定最终 evidence。
  candidate_top_k: 4
  # 4070 友好设置：先只塞入最高分 evidence，避免 RAG prompt 过长导致推理明显变慢。
  top_k: 1
  min_rerank_score: 0.0
  max_chars_per_evidence: 350

generation:
  temperature: 0.0
  top_p: 1.0
  # RAG 需要比 Direct 多一点空间写 Evidence Use，但 4070 不建议默认 256。
  max_new_tokens: 96

outputs:
  result_dir: Results/exp03_rag_qwen_7b_cuda_5
  prediction_file: predictions.jsonl
  metrics_file: metrics.json
