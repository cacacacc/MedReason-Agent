experiment_id: exp02_cot_qwen_7b_cuda_5
name: Chain-of-Thought Baseline - Qwen 2.5 VL 7B CUDA 5 Samples
phase: 2
inherits: configs/base.yaml

method:
  type: cot_vlm
  backend: qwen2_5_vl
  model_id: Qwen/Qwen2.5-VL-7B-Instruct
  torch_dtype: bfloat16
  device_map: auto
  prompt_version: cot_v1
  training_epochs: 0

dataset:
  name: VQA-RAD
  split: test
  scale: smoke
  max_samples: 5

generation:
  temperature: 0.0
  top_p: 1.0
  max_new_tokens: 256

outputs:
  result_dir: Results/exp02_cot_qwen_7b_cuda_5
  prediction_file: predictions.jsonl
  metrics_file: metrics.json
