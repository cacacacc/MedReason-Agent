experiment_id: exp03_rag_qwen_7b_cuda_smoke
name: Medical RAG Baseline - Qwen 2.5 VL 7B 4090D Smoke
phase: 3
inherits: configs/base.yaml

method:
  type: rag_vlm
  backend: qwen2_5_vl
  # AutoDL 上传模型后，建议改成本地路径：
  # /root/autodl-tmp/models/Qwen2.5-VL-7B-Instruct
  model_id: Qwen/Qwen2.5-VL-7B-Instruct
  # 4090D 是 24GB 显存，Qwen2.5-VL-7B 推理使用 bfloat16 更稳。
  torch_dtype: bfloat16
  device_map: auto
  prompt_version: rag_v3
  prompt_contract: structured_rag_v3
  rag_mode: knowledge_acquisition
  training_epochs: 0

dataset:
  name: VQA-RAD
  split: test
  scale: smoke
  max_samples: 1

retrieval:
  retriever: keyword
  reranker: keyword_reranker
  corpus_path: Data/Processed/medical_kb/seed_chunks.jsonl
  # 先多召回少量候选，再由 reranker/filter 决定最终 evidence。
  candidate_top_k: 6
  # 4090D 可以放 2 条 evidence；先不要开到 3-5，避免 RAG prompt 过长。
  top_k: 2
  min_rerank_score: 0.0
  max_chars_per_evidence: 500

generation:
  temperature: 0.0
  top_p: 1.0
  # 4090D 上先用 160，兼顾结构化输出和速度；OOM 时降到 96/128。
  max_new_tokens: 160

outputs:
  result_dir: Results/exp03_rag_qwen_7b_cuda_smoke
  prediction_file: predictions.jsonl
  metrics_file: metrics.json
