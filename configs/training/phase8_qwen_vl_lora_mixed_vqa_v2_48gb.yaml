experiment_id: exp08_qwen_vl_lora_mixed_vqa_v2_48gb
name: Phase 8 Qwen2.5-VL-7B LoRA Mixed Medical VQA v2 48GB
phase: 8
inherits: configs/base.yaml

method:
  type: qwen_vl_lora_sft
  model_id: /root/autodl-tmp/models/Qwen2.5-VL-7B-Instruct
  torch_dtype: bfloat16
  device_map: auto
  prompt_version: phase8_mixed_vqa_short_answer_sft_v2
  prompt_template: question_type_aware_short_v2
  training_objective: vqa_rad_dominant_mixed_medical_vqa_short_answer

dataset:
  name: Mixed-VQA-RAD-PathVQA-SLAKE-v2
  train_file: Data/Processed/mixed_vqa_sft_v2/train.jsonl
  validation_file: Data/Processed/mixed_vqa_sft_v2/validation.jsonl
  max_train_samples: null
  max_validation_samples: null

vision:
  min_pixels: 50176
  max_pixels: 602112

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  target_modules:
    - q_proj
    - v_proj

training:
  seed: 42
  num_train_epochs: 2
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.00005
  weight_decay: 0.01
  warmup_ratio: 0.03
  gradient_checkpointing: true
  bf16: true
  fp16: false
  optim: adamw_torch
  logging_steps: 20
  eval_strategy: steps
  eval_steps: 100
  save_strategy: steps
  save_steps: 100
  save_total_limit: 4
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  dataloader_num_workers: 0
  report_to: []
  resume_from_checkpoint: null

outputs:
  output_dir: Experiments/phase8/qwen_vl_lora_mixed_vqa_v2_48gb
  adapter_dir: Experiments/phase8/qwen_vl_lora_mixed_vqa_v2_48gb/adapter
  merged_model_dir: Experiments/phase8/qwen_vl_lora_mixed_vqa_v2_48gb/merged
  merge_adapter: true
  metrics_file: train_metrics.json
