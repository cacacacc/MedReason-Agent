experiment_id: exp08_qwen_vl_lora_vqa_rad_4090d
name: Phase 8 Qwen2.5-VL-7B LoRA VQA-RAD Short Answer Tuning
phase: 8
inherits: configs/base.yaml

method:
  type: qwen_vl_lora_sft
  model_id: /root/autodl-tmp/models/Qwen2.5-VL-7B-Instruct
  torch_dtype: bfloat16
  device_map: auto
  prompt_version: phase8_short_answer_sft_v1
  training_objective: image_question_to_short_answer

dataset:
  name: VQA-RAD
  train_split: train
  validation_split: validation
  max_train_samples: null
  max_validation_samples: null

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

training:
  seed: 42
  num_train_epochs: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 0.0002
  weight_decay: 0.0
  warmup_ratio: 0.03
  gradient_checkpointing: true
  bf16: true
  fp16: false
  logging_steps: 10
  eval_strategy: steps
  eval_steps: 100
  save_strategy: steps
  save_steps: 100
  save_total_limit: 2
  dataloader_num_workers: 0
  report_to: []
  resume_from_checkpoint: null

outputs:
  output_dir: Experiments/phase8/qwen_vl_lora_vqa_rad_4090d
  adapter_dir: Experiments/phase8/qwen_vl_lora_vqa_rad_4090d/adapter
  merged_model_dir: Experiments/phase8/qwen_vl_lora_vqa_rad_4090d/merged
  merge_adapter: true
  metrics_file: train_metrics.json
